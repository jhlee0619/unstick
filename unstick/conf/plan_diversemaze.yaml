ckpt_base_path: null          # model folder (hydra.yaml, checkpoints/)
model_epoch: latest
seed: 100
n_evals: 50
goal_source: maze_dist        # BFS distance-controlled goals on held-out layouts
eval_data_path: null          # diverse_maze_valstats (train/ and val/)
min_block_radius: 3
max_block_radius: 5
goal_H: 25

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: all

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 20
  n_taken_actions: 5
  reuse_actions: true         # warm start from the unexecuted tail of the previous plan
  sub_planner:
    target: planning.gd.GDPlanner
    lr: 0.1
    action_noise: 0
    horizon: 25
    opt_steps: 100
