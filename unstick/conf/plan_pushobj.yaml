ckpt_base_path: null          # model folder (hydra.yaml, checkpoints/)
model_epoch: latest
seed: 100
n_evals: 50
goal_source: segments         # targets from eval_data_path (plan_targets.pkl)
eval_data_path: null
ood_corruption: null          # null | blur | snp1 | dark
ood_level: null
env_kwargs_override: null     # e.g. {agent_color: Red} / {color: Red} / {goal_color: Red}
goal_H: 25

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: staged

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 20
  n_taken_actions: 5
  reuse_actions: true         # warm start from the unexecuted tail of the previous plan
  sub_planner:
    target: planning.gd.GDPlanner
    lr: 0.1
    action_noise: 0
    horizon: 25
    opt_steps: 100
