ckpt_base_path: null          # model folder (hydra.yaml, checkpoints/)
model_epoch: latest
seed: 100
n_evals: 50
goal_source: hard             # distant start/goal cells of PointMaze-Medium
eval_data_path: null          # point_maze_medium (normalization statistics)
env_kwargs_override: null     # dynamics shifts, e.g. {density_scale: 0.2} / {damping_scale: 20}
goal_H: 50

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 0
  base: 2
  mode: all

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 20
  n_taken_actions: 5
  reuse_actions: true         # warm start from the unexecuted tail of the previous plan
  sub_planner:
    target: planning.gd.GDPlanner
    lr: 0.1
    action_noise: 0
    horizon: 25
    opt_steps: 100
